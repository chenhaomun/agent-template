personality = "pragmatic"
# Per-agent models are generated from Claude capability tiers in sync_shared.py.
model = "gpt-6-sol"
model_reasoning_effort = "low"
model_context_window = 1050000

[windows]
sandbox = "elevated"

[desktop]
usePointerCursors = true
followUpQueueMode = "steer"
reviewDelivery = "inline"
git-commit-instructions = """
<ticket> - <summary>

- <point A>
- <point B>

Omit "<ticket> - " when there is no ticket."""
conversationDetailMode = "STEPS_COMMANDS"
defaultTerminalLocation = "bottom"
appearanceDarkCodeThemeId = "github"
appearanceTheme = "dark"
appearanceLightCodeThemeId = "vscode-plus"

[desktop.appearanceDarkChromeTheme]
accent = "#1f6feb"
contrast = 50
ink = "#e6edf3"
opaqueWindows = true
surface = "#0d1117"

[desktop.appearanceDarkChromeTheme.fonts]
code = '"Geist Mono", ui-monospace, "SFMono-Regular"'
ui = "Geist, Inter"

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#3fb950"
diffRemoved = "#f85149"
skill = "#bc8cff"

[desktop.appearanceLightChromeTheme]
accent = "#007acc"
contrast = 40
ink = "#000000"
opaqueWindows = true
surface = "#ffffff"

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#008000"
diffRemoved = "#ee0000"
skill = "#0000ff"

[features]
js_repl = false

[mcp_servers.dart]
command = "dart"
args = ["mcp-server"]
